<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>КРЕСТ: шпаргалка</title>
  <style>
    :root {
      --bg: #f4f6f3;
      --paper: #fffdf8;
      --ink: #1e241f;
      --muted: #6b756f;
      --line: #cfd7cd;
      --header: #d9ddd5;
      --accent: #216e4e;
      --accent-soft: #e7f1ec;
      --warn: #9a5a15;
      --shadow: 0 18px 45px rgba(31, 41, 35, .13);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
      letter-spacing: 0;
    }

    button {
      font: inherit;
      color: inherit;
    }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 12px 18px;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 253, 248, .92);
      position: sticky;
      top: 0;
      z-index: 20;
      backdrop-filter: blur(12px);
    }

    .brand {
      display: flex;
      align-items: baseline;
      gap: 10px;
      min-width: 0;
    }

    .brand h1 {
      margin: 0;
      font-size: 18px;
      line-height: 1.1;
      white-space: nowrap;
    }

    .brand span {
      color: var(--muted);
      font-size: 13px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .legend {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: flex-end;
      color: var(--muted);
      font-size: 13px;
    }

    .legend-item {
      border: 1px solid var(--line);
      background: #fff;
      padding: 6px 9px;
      border-radius: 6px;
      white-space: nowrap;
    }

    .legend-button {
      border: 1px solid #b9c3b8;
      background: #fff7df;
      padding: 6px 10px;
      border-radius: 6px;
      white-space: nowrap;
      cursor: pointer;
      font-weight: 700;
    }

    .legend-button:hover,
    .legend-button.active {
      border-color: #c49a36;
      background: #f1d88f;
    }

    .stage {
      padding: 14px;
      overflow: auto;
    }

    .map {
      min-width: 1120px;
      max-width: 1480px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: .94fr 1.22fr .94fr;
      grid-auto-rows: minmax(132px, auto);
      gap: 0;
      border: 2px solid #222;
      background: var(--paper);
      box-shadow: var(--shadow);
    }

    .block {
      border-right: 2px solid #222;
      border-bottom: 2px solid #222;
      min-width: 0;
      display: flex;
      flex-direction: column;
    }

    .block:nth-child(3n) { border-right: 0; }
    .block:nth-last-child(-n + 3) { border-bottom: 0; }

    .block-header {
      background: var(--header);
      border-bottom: 1px solid #aeb6ae;
      padding: 7px 10px;
      text-align: center;
      font-weight: 700;
      font-size: 14px;
      line-height: 1.2;
    }

    .block.cross-block {
      background: #fff7df;
    }

    .block.cross-block .block-header {
      background: #f1d88f;
      border-bottom-color: #c49a36;
      color: #2f2610;
    }

    .block.cross-block .term {
      background: #fff1c8;
      color: #3b3014;
    }

    .block.cross-block .actions,
    .block.cross-block .refs {
      background: #fff9e8;
    }

    .block.cross-block .note {
      background: #fff3ce;
      color: #6f5721;
    }

    .block.essence-footer .note {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      text-align: left;
      line-height: 1.42;
      font-size: 12px;
      color: #536058;
    }

    .note-action {
      width: 28px;
      height: 26px;
      flex: 0 0 auto;
      border: 1px solid #ccd4ca;
      border-radius: 5px;
      background: #fff;
      cursor: pointer;
      display: inline-grid;
      place-items: center;
    }

    .note-action:hover,
    .note-action.active {
      background: var(--accent-soft);
      border-color: var(--accent);
    }

    .block.prayer-column {
      grid-row: span 2;
    }

    .block.prayer-column .prayer-text {
      flex: 1;
      display: flex;
      align-items: center;
      text-align: center;
    }

    .block.prayer-column .note {
      margin-top: 0;
    }

    .rows {
      display: grid;
      grid-template-columns: minmax(130px, .8fr) auto minmax(104px, .62fr);
      align-items: stretch;
    }

    .row {
      display: contents;
    }

    .cell {
      min-height: 33px;
      padding: 6px 7px;
      border-bottom: 1px solid #e1e5df;
      font-size: 13px;
      line-height: 1.22;
      display: flex;
      align-items: center;
      min-width: 0;
    }

    .row:last-child .cell {
      border-bottom: 0;
    }

    .term {
      color: #4f5b53;
      background: #fbfcfa;
      border-right: 1px solid #e1e5df;
      font-weight: 600;
    }

    .actions {
      gap: 5px;
      justify-content: center;
      border-right: 1px solid #e1e5df;
      background: #fff;
    }

    .refs {
      justify-content: flex-end;
      text-align: right;
      font-weight: 700;
      color: #111;
      white-space: pre-line;
    }

    .icon-button {
      width: 28px;
      height: 26px;
      border: 1px solid #ccd4ca;
      border-radius: 5px;
      background: #fff;
      cursor: pointer;
      display: inline-grid;
      place-items: center;
      transition: background .12s ease, border-color .12s ease, transform .12s ease;
    }

    .icon-button:hover,
    .icon-button.active {
      background: var(--accent-soft);
      border-color: var(--accent);
      transform: translateY(-1px);
    }

    .prayer-text {
      margin: 10px 8px 8px;
      padding: 10px 11px;
      border: 1px solid #d8ded6;
      border-radius: 6px;
      background: #fff1c8;
      color: #3b3014;
      font-size: 12px;
      line-height: 1.45;
      white-space: pre-wrap;
    }

    .note {
      margin-top: auto;
      padding: 6px 8px;
      border-top: 1px solid #e1e5df;
      color: #7a847d;
      font-size: 11px;
      text-align: center;
      background: #fafafa;
    }

    .drawer {
      position: fixed;
      left: 16px;
      right: 16px;
      bottom: 112px;
      z-index: 30;
      max-height: min(56vh, 560px);
      display: grid;
      grid-template-rows: auto 1fr;
      border: 1px solid #b9c3b8;
      background: #fffdf8;
      box-shadow: 0 22px 55px rgba(21, 32, 25, .24);
      border-radius: 8px;
      transform: translateY(calc(100% + 28px));
      opacity: 0;
      pointer-events: none;
      transition: transform .18s ease, opacity .18s ease;
    }

    .drawer.open {
      transform: translateY(0);
      opacity: 1;
      pointer-events: auto;
    }

    .drawer-head {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: start;
      padding: 13px 15px 10px;
      border-bottom: 1px solid var(--line);
      background: #f8faf6;
      border-radius: 8px 8px 0 0;
    }

    .drawer-title {
      min-width: 0;
    }

    .drawer-title strong {
      display: block;
      font-size: 16px;
      line-height: 1.2;
    }

    .drawer-title span {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 13px;
    }

    .close {
      width: 34px;
      height: 32px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      cursor: pointer;
      font-size: 18px;
      line-height: 1;
    }

    .drawer-body {
      overflow: auto;
      padding: 14px 18px 18px;
      line-height: 1.48;
      font-size: 15px;
      white-space: pre-wrap;
    }

    .drawer-body.scripture {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 16px;
    }

    .empty {
      color: var(--muted);
      font-style: italic;
    }

    @media (max-width: 760px) {
      .topbar {
        align-items: flex-start;
        flex-direction: column;
        gap: 8px;
      }

      .brand {
        flex-direction: column;
        gap: 2px;
      }

      .legend {
        justify-content: flex-start;
      }

      .stage {
        padding: 10px;
      }

      .map {
        min-width: 980px;
      }

      .drawer {
        left: 8px;
        right: 8px;
        bottom: 72px;
        max-height: 58vh;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <h1>КРЕСТ</h1>
        <span>шпаргалка 📖 мест Писания и ✍ тезисов</span>
      </div>
      <div class="legend" aria-label="Вступление">
        <button class="legend-button" type="button" data-open-intro>✍ вступление</button>
      </div>
    </header>

    <section class="stage" aria-label="Карта изучения">
      <div id="map" class="map"></div>
    </section>
  </main>

  <aside id="drawer" class="drawer" aria-live="polite" aria-label="Подвал с материалом">
    <div class="drawer-head">
      <div class="drawer-title">
        <strong id="drawerTitle"></strong>
        <span id="drawerMeta"></span>
      </div>
      <button class="close" type="button" aria-label="Закрыть" onclick="closeDrawer()">×</button>
    </div>
    <div id="drawerBody" class="drawer-body"></div>
  </aside>

  <script>

        noteThesis: "Бог Своим Словом сотворил проект под названием “Земля” и Своим Словом сотворил человека. Между Богом и человеком была неразрывная связь: человек 24/7 находился в общении с Богом.\n\nБог — это среда обитания для человека, как вода для рыбы и земля для дерева. В воде у рыбы есть все необходимое для жизни; если вытащить рыбу из воды, она погибнет. Так же дерево не может жить без земли.\n\nТак и человек не может жить без Бога. Человек 24/7 находился в Слове Божьем: это Вечный Завет и Вечный Закон. Слово Бога — истинная среда обитания человека. Когда человек находился в Божьем Слове, он был живым и счастливым. Если извлечь человека из Слова Бога, он духовно умирает, начинает страдать, сталкиваться с проблемами, и в итоге это ведет к физической смерти.",
        rows: [

            thesis: "В первой главе Бытия Бог все сотворил Своим Словом, и это показывает нам Его сущность и могущество. В Бытие 1:1-3 написано: “В начале сотворил Бог небо и землю. Земля же была безвидна и пуста, и тьма была над бездною, и Дух Божий носился над водою. И сказал Бог: да будет свет. И стал свет”.\n\nБог сказал: “да будет свет”, и стал свет. Эти стихи показывают, что Бог существовал еще до сотворения земли, и все на земле Он творил Своим Словом. Это отражает Его первую сущность: Бог является Словом.\n\nВ Иоанна 1:1 так и написано: “В начале было Слово, и Слово было у Бога, и Слово было Бог”. Бог Своим Словом сотворил все на земле. Это своего рода сознание, через которое произошло все творение. Слово несет в себе Дух.",
            scripture: "Быт 1:1-3\nВ начале сотворил Бог небо и землю. Земля же была безвидна и пуста, и тьма над бездною, и Дух Божий носился над водою. И сказал Бог: да будет свет. И стал свет.\n\nИн 1:1\nВ начале было Слово, и Слово было у Бога, и Слово было Бог."
          },
          {
            term: "дух",
            refs: "Ин 6:63 |\nИн 4:24",
            thesis: "Слово равно Дух. В Иоанна 4:24 написано: “Бог есть Дух, и поклоняющиеся Ему должны поклоняться в духе и истине”. А в Иоанна 6:63 Иисус говорит: “Дух животворит; плоть не пользует нимало. Слова, которые говорю Я вам, суть дух и жизнь”.\n\nБог является Словом, а Слово является Духом. Слово несет в себе Дух жизни, любовь и истину. В жизни мы часто сталкиваемся со словами, которые нас обижают и огорчают. Некоторые слова могут даже убить. Такие слова не от Бога.\n\nИменно Божье Слово дает жизнь. Оно наполняет нас любовью, миром, истиной и уверенностью. Божье Слово несет в себе такой Дух и такую информацию, от которой мы оживотворяемся. Слово всегда становится плотью.",
            scripture: "Ин 6:63\nДух животворит; плоть не пользует нимало. Слова, которые говорю Я вам, суть дух и жизнь.\n\nИн 4:24\nБог есть дух, и поклоняющиеся Ему должны поклоняться в духе и истине."
          },
          {
            term: "плоть",
            refs: "Ин 1:14",
            thesis: "В Иоанна 1:14 написано: “И Слово стало плотью, и обитало с нами, полное благодати и истины; и мы видели славу Его, славу, как Единородного от Отца”. Слово Божье всегда становится плотью.\n\nДругими словами, оно воплощается в жизнь — в материальный, физический мир. Иисус Христос — это Слово Бога во плоти. Он был Божьим образом на земле, руками Бога. Через Него Бог действовал среди людей, проявлял Свою любовь и заботу.\n\nМы видели славу Его: видели, как Бог проявляет Свою мудрость, любовь и силу в жизни людей через Сына, через Его слова и действия.\n\nИтак, мы рассмотрели три личности Бога. Бог Отец является Словом — источником всей истинной мудрости. Бог Дух Святой — это сердце Бога, источник жизни; Он дает людям любовь и мир. Бог Сын, Иисус Христос, — это Слово Бога во плоти, руки Бога, действие Бога на земле. Каждая личность Бога проявляет Себя по-своему, но вместе Они составляют Триединого Бога.",

      {
        id: "creation",
        title: "(1) принцип сотворения",
        note: "Неразрывная связь Бога и человека. Вечный духовный мир.",
        noteThesis: "Сейчас подробно рассмотрим Божьи благословения и их назначение. Это важно, чтобы человек не жил в искаженном понимании христианства, будто, придя к Богу, он сразу получит семью, работу, дом и все остальное, и ему ничего не нужно будет делать. Такое представление ошибочно.\n\nВ Бытие 1:28 написано: “И благословил их Бог, и сказал им Бог: плодитесь и размножайтесь, и наполняйте землю, и обладайте ею, и владычествуйте...” Здесь существует иерархия: Бог сотворил человека и дал ему землю в управление. “Владычествуйте” означает, что земля и все творение были переданы под управление человека.\n\nВначале Бог сотворил духовный мир, сотворил небо. Это невидимый информационный мир, наполненный Божьим Словом. Его невозможно увидеть. Духовный мир превосходит материю, пространство и время. Он не имеет ограничений, не зависит от физических законов и не подчиняется ограничениям материального мира. Там нет расстояний, границ и временных рамок; там можно находиться везде и одновременно.\n\nВсе, что существует в духовном мире, не связано с видимым миром и не подчиняется его ограничениям. Все духовные благословения там безграничны, потому что там есть Божье Слово, наполненное Божьей любовью, мудростью и силой. Все это не имеет пределов. Этот мир вечен. В Божьем Слове содержится вечная жизнь. Поэтому вначале Бог сотворил именно вечный духовный мир. Духовный мир всегда первичен.\n\nИ только после этого Бог сотворил землю — физический мир: растительный и животный мир, а также человека. Этот мир ограничен: здесь есть материя, пространство и время. Мы не можем быть одновременно в разных местах, мы можем находиться только в одном месте здесь и сейчас. Все ресурсы в этом мире ограничены, и все видимое со временем заканчивается. Земля — это временный мир. Здесь все склоняется к смерти, и смерть имеет власть в этом мире.\n\nПоскольку человек живет в ограниченном физическом мире, склонном к смерти, ему необходимы духовные благословения, чтобы преодолеть эти ограничения. Среди всех творений Бог особым образом сотворил человека: человек — духовная личность. Бог передал человеку Свой Дух: “вдунул в лице его дыхание жизни, и стал человек душею живою”. Это означает, что у человека есть способность принимать духовные благословения из духовного мира.\n\nЧеловек является проводником между духовным и физическим миром. Он как почтальон Божьего Слова, через которого духовное становится плотью в физическом мире. Но это возможно только при одном условии: Бог может наделять человека духовными благословениями, если между Богом и человеком есть правильные отношения.\n\nПравильные отношения между Богом и человеком — это когда человек осознает, что Бог — Творец, а человек — творение. Бог существовал еще до сотворения мира и лучше знает, как устроен мир, поэтому человеку нужно надеяться только на Господа.\n\nТакже человек должен осознавать, что Бог — Правитель, а человек — подчиненный, в хорошем смысле. Мы не спорим с Богом и не доказываем свою правоту, а подчиняемся Божьему Слову. Мы осознаем, что Бог — Хозяин нашей жизни, а человек — слуга, работник Бога, который выполняет Божью работу на земле. Не свою работу, которую он сам себе придумал, а Божью работу.\n\nКогда человек надеется на Бога, подчиняется Ему и служит Ему, другими словами, находится в завете с Богом, Бог начинает передавать ему Божьи благословения. Когда человек не принимает свои слова, а слушает Божье Слово, общается с Богом и исполняет Его волю, он начинает слышать, что от него хочет Бог. Бог передает ему Божьи поручения и наделяет духовными благословениями — Своим Словом, в котором есть мудрость, любовь и сила.\n\nБог передает человеку Свой образ — Божий образ мышления. Поэтому так важно ученичество, где человек приобретает Божий образ мышления, в котором заложена вечная жизнь. В Божьем образе мышления человек осознает, кто он, какова его миссия, видит направление и видение на свою жизнь.\n\nПолучив эти духовные благословения, человек может управлять творением, исполнять Божью волю, Божий план и Божью миссию. С таким мышлением, выходя в физический мир, человек начинает приобретать духовную силу: у него улучшается здоровье, раскрываются таланты. Бог говорит: “наполняй землю” — наполняй ее своими талантами, и тогда приходит Божья экономика.\n\nУ человека появляется семья, потому что построить крепкую семью можно только с Божьим образом мышления. Бог создал мужчину и женщину, и это была первоначальная церковь. Первоначальная церковь была наполнена учениками, которые находились в завете с Богом. “Плодитесь и размножайтесь” — это значит плодитесь такими же единомышленниками, как и вы. Плод — это ученик.\n\nЧеловек имел власть, но не для того, чтобы разрушать землю или подавлять людей. Бог делегировал человеку землю и дал власть управлять творением, влиять на людей, передавать им Божий образ, завоевывать людей для Бога, строить абсолютную команду и абсолютную систему.\n\nВся духовная сила дается для того, чтобы человек исполнял Божий план на земле и Божью миссию. В Матфея 6:33 написано: “Ищите же прежде Царства Божия и правды Его, и это все приложится вам”. Мы работники Бога. Бог открывает нам Свой план, когда на первом месте у нас стоит Божья миссия, когда мы выполняем работу, которую поручил Господь, — распространение Евангелия от края до края. Тогда Бог наделяет нас духовной силой и делает из нашей жизни шедевр.",
        rows: [
          {
            term: "образ Божий",
            refs: "Быт 1:27",
            thesis: "Во что человек поверил, тем он и становится. Сначала в голову приходят слова и мысли. С детства человек слышит слова от родителей, в школе, на улице, из книг и медиа. Те слова, которым человек поверил и которые коснулись его сердца, формируют его характер, личность и судьбу.\n\nЧеловек был создан по Божьему образу. В Бытие 1:27 написано: “И сотворил Бог человека по образу Своему, по образу Божию сотворил его; мужчину и женщину сотворил их”. Человек был создан, чтобы иметь отношения и общение с Богом.\n\nБожий образ — это образ мышления, идентичный мышлению Бога. Человек обладал таким мышлением, потому что постоянно находился в общении с Богом, жил в Божьем Слове, повиновался Ему, надеялся на Него и исполнял Божью волю. Другими словами, человек постоянно общался с Богом и учился у Бога.\n\nЧеловек — единственное существо, способное выражать свои мысли и чувства словами. Все начинается со слов: слова формируют идеи, идеи — действия, действия — привычки, привычки — характер, а характер формирует судьбу. Человек, находившийся в Божьих мыслях, имел Божью судьбу.",
            scripture: "Быт 1:27\nИ сотворил Бог человека по образу Своему, по образу Божию сотворил его; мужчину и женщину сотворил их."
          },
          {
            term: "дух личность",
            refs: "Быт 2:7",
            thesis: "Человек — духовная личность. В Бытие 2:7 написано, что Господь Бог создал человека из праха земного — это тело, — и вдунул в лицо его дыхание жизни, Свой Дух, и человек стал душою живою.\n\nТак как Бог триедин, человек, созданный по Божьему образу, тоже триедин: он состоит из духа, души и тела. Только когда Бог вдунул в человека Свой Дух, Свое Божье Слово, человек стал душою живою.\n\nДуша живая — это состояние, когда у человека есть жизнь внутри: силы, желание учиться, работать, дружить, строить семью, помогать родителям и исполнять Божью волю. Человек живет не одной едой; человек живет Божьим Словом. Слово Божье — источник жизни и силы для человека.\n\nВначале всегда должно быть Божье Слово, которое дает жизнь и по которому человек действует. Гармония приходит тогда, когда дух, душа и тело находятся в согласии и направлены Божьим Словом. Человек не может только чувствовать и ничего не делать, только думать и не чувствовать или действовать, не задумываясь.\n\nКогда человек верит Божьему Слову, оно проникает в сердце. Человек общается с Богом, слушает Его, получает Божьи мысли, видение, мечты и цели. Его образ начинает меняться на Божий, и он действует, исходя из Божьего Слова. Так человек воплощает Божью волю и Божьи планы в физическом мире.",
            scripture: "Быт 2:7\nИ создал Господь Бог человека из праха земного, и вдунул в лице его дыхание жизни, и стал человек душею живою."
          },
          {
            term: "благословения",
            refs: "Быт 1:28 | Мф 6:33",
            thesis: "Только когда человек выстраивает общение и отношения с Богом, он может получить Божьи благословения. У человека изначально были благословения от Бога.\n\nВ Бытие 1:28 написано: “И благословил их Бог, и сказал им Бог: плодитесь и размножайтесь, и наполняйте землю, и обладайте ею, и владычествуйте…” У человека было все изначально: он был счастлив, наслаждался жизнью и общением с Богом.\n\nПосле сотворения Бог благословил человека — Он благословил Божий образ. Когда человек находился в Божьем образе, он мог общаться с Богом и слышать Его инструкции. Бог дал ему духовные благословения: мудрость, любовь и силу для действия. Именно исходя из Божьего мышления, мудрости, любви и силы человек мог действовать в видимом мире и приобретать все необходимое для жизни.\n\nУ человека было крепкое здоровье: первые люди имели вечную жизнь, не умирали, не болели и не имели духовных, психических и физических проблем. У человека была работа: Адам возделывал и охранял сад. Бог предусмотрел работу для человека еще до его сотворения.\n\nУ человека была семья: Бог сказал, что нехорошо быть человеку одному, и сотворил ему помощницу. Мужчина и женщина были первоначальной командой, первоначальной церковью. Только с Божьим мышлением, мудростью, любовью и силой можно построить по-настоящему крепкую семью.\n\nУ человека была карьера: “плодитесь и размножайтесь” — это не только физическое размножение. Это также значит плодиться в дарах и талантах, распространять Божий образ по земле и умножать единомышленников. Только с Божьим мышлением человек может развивать истинные таланты и создавать команды.\n\nУ человека была власть: Бог делегировал ему управление землей. Это не власть для подавления людей, а способность вдохновлять, творить, наполнять землю, приводить людей к Богу, созидать, а не разрушать. Все хотят успешной и гармоничной жизни, но семья, здоровье, развитие, работа и власть — это не конечные цели, а духовная сила, которая прилагается, когда человек выполняет Божью миссию.",

          {

            thesis: "Как истинный Царь, Иисус победил сатану в голову и избавил человека от третьей коренной проблемы — власти сатаны. Он одержал победу, дал нам новую жизнь и ввел в Свое Царство.\n\nВ 1 Иоанна 3:8 написано: “Для сего-то и явился Сын Божий, чтобы разрушить дела диавола”. Иисус разрушил дела дьявола, победил власть тьмы и дал человеку новое будущее с Богом.\n\nПринять Иисуса Христа верой — значит признать Его Господом и Спасителем и поверить, что Он Сын Божий, пришедший в мир, умерший за наши грехи и воскресший, чтобы восстановить связь человека с Богом.\n\nАпостол Павел пишет в Римлянам 10:9-10,13: “Ибо если устами твоими будешь исповедовать Иисуса Господом и сердцем твоим веровать, что Бог воскресил Его из мертвых, то спасешься... ибо всякий, кто призовет имя Господне, спасется”. Это не религиозный ритуал, а живая вера: сердце доверяет Богу, а уста открыто исповедуют и признают Его.\n\nК Богу не нужно идти далеко и Его не нужно где-то искать. Бог всегда рядом с нами с самого рождения и ждет, когда мы впустим Его в свою жизнь. В Откровении 3:20 сказано: “Се, стою у двери и стучу: если кто услышит голос Мой и отворит дверь, войду к нему, и буду вечерять с ним, и он со Мною”.\n\nБог не ломится силой — Он ждет отклика. Открыть дверь сердца значит позволить Богу войти. А слова “буду вечерять с ним” означают близкое общение: восстановление и развитие личных отношений с Богом.\n\nБожью любовь не нужно заслуживать. Спасение — это Божья благодать. В Ефесянам 2:8-9 написано: “Ибо благодатью вы спасены через веру, и сие не от вас, Божий дар: не от дел, чтобы никто не хвалился”.\n\nСпасение — это дар Божий. Его нельзя заработать делами или человеческими усилиями; оно принимается верой. И сама вера — Божий дар.\n\nПринявшие Иисуса Христа своим Господом и Спасителем имеют жизнь вечную и на суд не приходят. В Иоанна 5:24 написано: “Истинно, истинно говорю вам: слушающий слово Мое и верующий в Пославшего Меня имеет жизнь вечную, и на суд не приходит, но перешел от смерти в жизнь”.\n\nЭто значит, что верующий уже перешел от духовной смерти к жизни. Это происходит не когда-то потом, а с момента веры и принятия Иисуса в свое сердце. Мы сразу переходим в Царство Божие.\n\nВ Колоссянам 1:13 написано: “Избавившего нас от власти тьмы и введшего в Царство возлюбленного Сына Своего”. Бог освобождает нас от власти тьмы, освобождает от греха, вводит в Свое Царство, и мы становимся новым творением. Это новая жизнь и новое будущее с Богом уже сейчас.",

            thesis: "Сейчас мы переходим к пятому пункту — усилия человека. Какие усилия человек прилагает, чтобы вернуться к Богу? Какими собственными силами он пытается это сделать? Первое усилие — человек уходит в религию.\n\nВ Деяниях святых апостолов написано: “ибо нет другого имени под небом, данного человекам, которым надлежало бы нам спастись”. Здесь говорится, что Бог дал имя, через которое человек может встретиться с Ним. Это духовный принцип.\n\nВо все времена люди искали имя, которое могло бы избавить их от страданий, переживаний, греха и психических проблем. Когда человек сталкивается с трудностями, он ищет того, кто способен помочь. Он ищет имя. Но люди ошибочно начинают искать имя мамы, папы, психолога, духовного гуру, Мухаммеда, Будды и так далее.\n\nБиблия ясно говорит, что существует только одно имя, которое действительно может принести спасение и утешение, — Иисус Христос. Именно в Иисусе Христе есть вся полнота бытия и все ответы. Достаточно веры во Христа. Но религия — это попытка человека без Христа наладить отношения с Богом.\n\nВ отличие от христианства, религия учит, что человек должен заслужить спасение через дела: исполнение заповедей, праведную жизнь, соблюдение обрядов, правил, традиций, духовных практик, самопознание в буддизме, намаз и многое другое. Как будто с помощью разных инструментов человек может самостоятельно искупить грех.\n\nКонечная цель всех религий — чтобы человек собственными усилиями, соблюдая законы и правила, избавился от греха и таким образом пришел к Богу. Но это невозможно. Такая система мышления рождает еще больше переживаний и психических проблем, потому что человек не может соответствовать огромному количеству законов и правил.\n\nВ Библии сказано, что люди находятся в труде и обременении. Избавить их от переживаний может только Бог. Только Бог способен избавить человека от греха и внутренней боли; человеку самостоятельно это невозможно.\n\nВ религии нужно заслуживать спасение через дела и соблюдение закона. В х     const layout = [
      "essence", "creation", "person",
      "root", "jesus-answer", "only-way",
      "world", "effort", "believer",
      "unbeliever", "assurance"
    ];

    const blockById = Object.fromEntries(blocks.map((block) => [block.id, block]));
    const map = document.getElementById("map");
    const drawer = document.getElementById("drawer");
    const drawerTitle = document.getElementById("drawerTitle");
    const drawerMeta = document.getElementById("drawerMeta");
    const drawerBody = document.getElementById("drawerBody");
    const introThesis = `Вступление перед нулевым блоком

Чтобы понять принцип сотворения человека, сначала важно увидеть сущность Бога.

Бог вездесущий, всеведущий и всемогущий. Он открылся Моисею именем “Я есмь”, то есть Сущий, существующий вне времени.

Бог одновременно выше прошлого, настоящего и будущего. У Него нет границ: Его никто не сотворил, Он был и есть всегда.

Поэтому Бога невозможно поместить в крестик, икону или “святое место”. Он больше любого предмета и места, находится вне времени и пространства и существовал еще до сотворения мира.`;

    function render() {
      map.innerHTML = "";
      const placed = layout.map((id) => blockById[id]);

      placed.forEach((block) => {
        const article = document.createElement("article");
        const isCrossBlock = ["creation", "root", "jesus-answer", "only-way", "effort"].includes(block.id);
        article.className = `block${isCrossBlock ? " cross-block" : ""}${block.id === "effort" ? " prayer-column" : ""}${block.id === "essence" ? " essence-footer" : ""}`;
        if (block.id === "assurance") article.style.gridColumn = "3";
        article.innerHTML = `
          <div class="block-header">${escapeHtml(block.title)}</div>
          <div class="rows">
            ${block.rows.map((row, rowIndex) => `
              <div class="row">
                <div class="cell term">${escapeHtml(row.term)}</div>
                <div class="cell actions">
                  <button class="icon-button" type="button" title="Открыть тезисы" aria-label="Открыть тезисы" data-kind="thesis" data-block="${escapeHtml(block.id)}" data-row="${rowIndex}">✍</button>
                  <button class="icon-button" type="button" title="Открыть место Писания" aria-label="Открыть место Писания" data-kind="scripture" data-block="${escapeHtml(block.id)}" data-row="${rowIndex}">📖</button>
                </div>
                <div class="cell refs">${escapeHtml(row.refs)}</div>
              </div>
            `).join("")}
          </div>
          <div class="note">
            <span>${escapeHtml(block.note)}</span>
            ${block.noteThesis ? `<button class="note-action" type="button" title="Открыть тезисы" aria-label="Открыть тезисы" data-note-thesis="${escapeHtml(block.id)}">✍</button>` : ""}
          </div>
          ${block.prayer ? `<div class="prayer-text">${escapeHtml(block.prayer)}</div>` : ""}
        `;
        map.appendChild(article);
      });

      map.addEventListener("click", (event) => {
        const noteButton = event.target.closest("button[data-note-thesis]");
        if (noteButton) {
          const block = placed.find((item) => item.id === noteButton.dataset.noteThesis);
          openNoteDrawer(block, noteButton);
          return;
        }

        const button = event.target.closest("button[data-kind]");
        if (!button) return;
        const block = placed.find((item) => item.id === button.dataset.block);
        const row = block.rows[Number(button.dataset.row)];
        openDrawer(block, row, button.dataset.kind);
      });
    }

    function openIntroDrawer() {
      document.querySelectorAll(".icon-button.active, .note-action.active").forEach((button) => button.classList.remove("active"));
      document.querySelectorAll("[data-open-intro]").forEach((button) => button.classList.add("active"));
      drawerTitle.textContent = "Вступление";
      drawerMeta.textContent = "✍ тезисы";
      drawerBody.className = "drawer-body";
      drawerBody.innerHTML = escapeHtml(introThesis);
      drawer.classList.add("open");
    }

    function openNoteDrawer(block, button) {
      document.querySelectorAll(".icon-button.active, .note-action.active").forEach((item) => item.classList.remove("active"));
      button.classList.add("active");
      drawerTitle.textContent = `${block.title}: ${block.note}`;
      drawerMeta.textContent = "✍ тезисы";
      drawerBody.className = "drawer-body";
      drawerBody.innerHTML = block.noteThesis ? escapeHtml(block.noteThesis) : '<span class="empty">Здесь пока нет текста.</span>';
      drawer.classList.add("open");
    }

    function openDrawer(block, row, kind) {
      document.querySelectorAll(".icon-button.active, .note-action.active").forEach((button) => button.classList.remove("active"));
      const active = document.querySelector(`button[data-kind="${kind}"][data-block="${block.id}"][data-row="${block.rows.indexOf(row)}"]`);
      if (active) active.classList.add("active");

      const isScripture = kind === "scripture";
      drawerTitle.textContent = `${block.title}: ${row.term}`;
      drawerMeta.textContent = isScripture ? "📖 место Писания" : "✍ тезисы";
      drawerBody.className = `drawer-body${isScripture ? " scripture" : ""}`;
      const text = isScripture ? row.scripture : row.thesis;
      drawerBody.innerHTML = text ? escapeHtml(text) : '<span class="empty">Здесь пока нет текста.</span>';
      drawer.classList.add("open");
    }

    function closeDrawer() {
      drawer.classList.remove("open");
      document.querySelectorAll(".icon-button.active, .note-action.active").forEach((button) => button.classList.remove("active"));
      document.querySelectorAll("[data-open-intro]").forEach((button) => button.classList.remove("active"));
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") closeDrawer();
    });

    document.querySelector("[data-open-intro]").addEventListener("click", openIntroDrawer);

    render();
  </script>
